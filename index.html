<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <style>
        canvas {
            border: 1px solid black;
        }
    </style>
</head>
<body>

    <h1>Snake</h1>
    <div class="game-container">
        <button id="startButton">Start</button>
        <button id="pauseButton">Pause</button>
        <button id="resumeButton">Resume</button>
        <button id="replayButton">Replay</button>
    </div>
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    <p id="info"></p>

    <script>
        // ===== GAME SETUP =====
        const canvas =
            document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

   //Buttons

        const replayButton = document.getElementById("replayButton");
        const pauseButton = document.getElementById("pauseButton");
        const startButton = document.getElementById("startButton");
        const resumeButton = document.getElementById("resumeButton");

        
        // ===== INITIAL STATE =====
        let snake = [
            { x: 10, y: 10 },
            { x: 9, y: 10 },
            { x: 8, y: 10 }
        ];
        let direction = { x: 1, y: 0 };
        let food = { x: 15, y: 15 };
        let score = 0;

        // ===== DRAWING =====
        const drawGame = () => {
            ctx.clearRect(0, 0,
                canvas.width, canvas.height);

            ctx.fillStyle = "red";
            ctx.fillRect(
                food.x * gridSize,
                food.y * gridSize,
                gridSize, gridSize
            );

            ctx.fillStyle = "black";
            for (const segment of snake) {
                ctx.fillRect(
                    segment.x * gridSize,
                    segment.y * gridSize,
                    gridSize, gridSize
                );
            }
        };

        drawGame();

         const moveSnake = () => {
            const head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };
            const eatingFood = head.x === food.x && head.y === food.y;

            if (
                head.x < 0 || head.x >= tileCount ||
                head.y < 0 || head.y >= tileCount
            ) {
                endGame();
                return;
            }

            const bodyToCheck = snake.slice(0, eatingFood ? snake.length : -1);
            if (bodyToCheck.some(segment => segment.x === head.x && segment.y === head.y)) {
                endGame();
                return;
            }

            snake.unshift(head);

            if (eatingFood) {
                score++;
                info.textContent = `Score: ${score}`;
                gameSpeed = Math.max(minimumSpeed, gameSpeed - speedIncrease);
                if (!placeFood()) {
                    endGame("You win!");
                    return;
                }
                startGameLoop();
            } else {
                snake.pop();
            }
        };

        // Game loop

        const gameLoop = () => {
            moveSnake();
            drawGame();
        };
        
        // Startbutton action

        startButton.addEventListener("click", startGame);


         // Arrowkeys action
        
        document.addEventListener("keydown", (event) => {
            if (!isStarted || isPaused || isGameOver) return;

            switch (event.key) {
                case "ArrowUp":
                    if (direction.y === 0) direction = { x: 0, y: -1 };
                    break;
                case "ArrowDown":
                    if (direction.y === 0) direction = { x: 0, y: 1 };
                    break;
                case "ArrowLeft":
                    if (direction.x === 0) direction = { x: -1, y: 0 };
                    break;
                case "ArrowRight":
                    if (direction.x === 0) direction = { x: 1, y: 0 };
                    break;
            }
        });

    </script>

</body>
</html>
